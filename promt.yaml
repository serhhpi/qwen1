# ============================================================
#  promt.yaml — предустановленные промпты обработки Excel-файлов
#
#  Плейсхолдеры (подставляются автоматически в app.py):
#    {tables}      — содержимое всех загруженных таблиц текстом
#    {files}       — список имён загруженных файлов
#    {files_count} — количество файлов
#
#  Правки подхватываются без перезапуска сервера.
# ============================================================

default_prompt: consolidate

# Модель Qwen: qwen-turbo (дёшево) | qwen-plus (баланс) | qwen-max (точно)
# Модель для GigaChat -
model: GigaChat-3-Ultra
temperature: 0.1

max_tokens: 8000

prompts:

  # ------------------------------------------------------------
  consolidate:
    label: "Сводная таблица"
    system: |
      Ты — Senior Data Analyst. Ты получаешь данные из Excel-файлов
      и возвращаешь результат СТРОГО в виде JSON, без пояснений,
      без комментариев и без markdown-разметки.
    user: |
      Ниже приведены данные из {files_count} Excel-файлов ({files}).

      {tables}

      Алгоритм обработки:
      1. Изучи все таблицы и определи общие по смыслу столбцы.
      2. Приведи названия столбцов к единому стилю: русский язык,
         строчные буквы, вместо пробелов — подчёркивания.
      3. Объедини строки всех файлов в одну таблицу, добавив столбец
         «источник» с именем файла, из которого пришла строка.
      4. Удали полные дубликаты строк.
      5. Отсортируй по столбцу «дата», если он есть; иначе — по первому
         столбцу. Даты приведи к формату ГГГГ-ММ-ДД.
      6. Числовые значения очисти от пробелов и символа валюты, приведи
         к числу с точкой.

      Верни JSON строго по схеме (и ничего, кроме него):
      {
        "sheets": [
          {
            "name": "Сводная",
            "headers": ["столбец_1", "столбец_2", "источник"],
            "rows": [["значение", "значение", "файл.xlsx"]]
          }
        ]
      }

  # ------------------------------------------------------------
  compare:
    label: "Сравнение файлов"
    system: |
      Ты — аналитик, который сравнивает наборы данных. Отвечаешь
      только валидным JSON без какой-либо разметки и пояснений.
    user: |
      Даны {files_count} файла ({files}).

      {tables}

      Алгоритм обработки:
      1. Определи общий ключ строк (например, название, артикул или id).
      2. Найди строки, которые есть только в первом файле, только во
         втором, и общие для всех файлов.
      3. Для общих строк сравни числовые столбцы и выведи разницу.
      4. Посчитай контрольные суммы: сколько строк в каждом файле.

      Верни JSON строго по схеме (и ничего, кроме него):
      {
        "sheets": [
          {"name": "Только в файле 1", "headers": [...], "rows": [...]},
          {"name": "Только в файле 2", "headers": [...], "rows": [...]},
          {"name": "Расхождения", "headers": ["ключ", "поле", "файл_1", "файл_2", "разница"], "rows": [...]},
          {"name": "Контрольные суммы", "headers": ["файл", "строк"], "rows": [...]}
        ]
      }

  # ------------------------------------------------------------
  cleanup:
    label: "Очистка данных"
    system: |
      Ты — специалист по качеству данных. Возвращаешь только JSON,
      без пояснений и разметки.
    user: |
      Вот данные из {files_count} файлов ({files}).

      {tables}

      Алгоритм обработки:
      1. Удали пустые строки и столбцы без данных.
      2. Исправь явные опечатки в названиях столбцов и категорий.
      3. Приведи телефоны к формату +7XXXXXXXXXX, даты — к ГГГГ-ММ-ДД.
      4. Убери дубликаты, оставив первое вхождение.
      5. На втором листе составь отчёт: что было исправлено и сколько.

      Верни JSON строго по схеме (и ничего, кроме него):
      {
        "sheets": [
          {"name": "Очищено", "headers": [...], "rows": [...]},
          {"name": "Отчёт об исправлениях", "headers": ["правка", "количество"], "rows": [...]}
        ]
      }
