<!DOCTYPE html>
<html>
<head>
    <title>Qwen Excel Processor</title>
</head>
<body>
    <h1>Загрузите Excel-файл</h1>
    <form action="/process" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx,.xls" required>
        <br><br>
        <button type="submit">Обработать с помощью Qwen</button>
    </form>
    {% if download_link %}
        <p><a href="{{ download_link }}" download>Скачать результат (.xlsx)</a></p>
    {% endif %}
</body>
</html>
